name = "lucky-hat-b241"
main = "deepseek-memory-worker.js"
compatibility_date = "2024-01-01"

[limits]
# A consulta da Junto pode exigir uma chamada por modalidade, além das APIs,
# Redis e D1. Requer conta Workers paga; no plano gratuito o teto é 50.
subrequests = 1000

[vars]
# Secrets são configurados via dashboard ou wrangler secret put
# DEEPSEEK_API_KEY, UPSTASH_REDIS_REST_URL, UPSTASH_REDIS_REST_TOKEN

# Banco D1 — histórico de T&C por tomador (ver SPEC.md secao 13).
# 1. wrangler d1 create tc-lavoro-db
# 2. Cole abaixo o database_id que o comando acima imprimir.
# 3. wrangler d1 migrations apply tc-lavoro-db --remote
[[d1_databases]]
binding = "DB"
database_name = "tc-lavoro-db"
database_id = "9a9d565d-941e-4ea2-a8d4-9190a692fd85"
