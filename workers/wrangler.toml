name = "lavoro-portal-seguradoras"
main = "deepseek-memory-worker.js"
compatibility_date = "2024-01-01"

# O Worker nao tem autenticacao propria: a URL workers.dev so pode ficar
# ligada com a Access application "lavoro-portal-seguradoras" protegendo o
# Worker (ver SPEC.md 12.0c). Preview URLs ficam desligadas por nao serem usadas.
workers_dev = true
preview_urls = false

[vars]
# Secrets são configurados via dashboard ou wrangler secret put
# DEEPSEEK_API_KEY, UPSTASH_REDIS_REST_URL, UPSTASH_REDIS_REST_TOKEN

# Banco D1 — histórico de T&C por tomador (ver SPEC.md secao 13).
# 1. wrangler d1 create tc-lavoro-db
# 2. Cole abaixo o database_id que o comando acima imprimir.
# 3. wrangler d1 migrations apply tc-lavoro-db --remote
[[d1_databases]]
binding = "DB"
database_name = "tc-lavoro-db"
database_id = "8cacfb22-7d1d-4cfc-908e-e278fdfc78e3"
